<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosa Nostra</title>
  <link rel="preload" href="assets/background.jpg" as="image">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/options.css">
  <link rel="stylesheet" href="css/loadgame.css">
</head>
<body>
  <div id="viewport">
    <div id="backdrop" aria-hidden="true"></div>

    <div id="stage" class="is-loading">
      <canvas id="scene" aria-hidden="true"></canvas>

      <aside id="panel">
        <canvas id="panel-bg" aria-hidden="true"></canvas>

        <header class="brand">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </header>

        <nav class="menu" id="menu" aria-label="Main menu">
          <div class="page-heading" id="page-heading" aria-hidden="true"></div>
          <div class="highlight" id="highlight" aria-hidden="true">
            <span class="hl-glow"></span>
            <span class="hl-line hl-top"></span>
            <span class="hl-line hl-bottom"></span>
            <span class="hl-shine"></span>
            <span class="hl-chevrons">
              <svg viewBox="0 0 30 20" width="30" height="20">
                <path class="chev chev-1" d="M2 3 L10 10 L2 17" />
                <path class="chev chev-2" d="M13 3 L21 10 L13 17" />
              </svg>
            </span>
          </div>
          <div class="items" id="items" role="menu"></div>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <footer class="hints" id="hints"></footer>
      </aside>

      <canvas id="fx" aria-hidden="true"></canvas>

      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal-card">
          <span class="hl-line hl-top"></span>
          <h2 id="modal-title"></h2>
          <p id="modal-text"></p>
          <div class="modal-actions" id="modal-actions"></div>
          <span class="hl-line hl-bottom"></span>
        </div>
      </div>

      <div class="fade" id="fade" aria-hidden="true"></div>
    </div>
  </div>

  <script src="js/menu.config.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/desk.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/options.js"></script>
  <script src="js/loadgame.js"></script>
  <script>
    /* ---------------------------------------------------------------
       HOOK YOUR GAME UP HERE
       CosaMenu.on(action, handler) runs when a button with that
       action is picked. The menu blinks, fades to black, then calls
       your handler. Return CosaMenu.BACK (or call CosaMenu.show())
       to bring the menu back afterwards.

       Actions with no handler show the "Coming soon" toast instead.
       Options and Load Game have their own screens (options.js,
       loadgame.js). Start Game below is a placeholder.

       Loading a save:   CosaLoad.onLoad((save) => { ... save.data ... });
       Saving the game:  CosaSaves.save(1, { family, don, date, playTime, thumbnail, data });
       --------------------------------------------------------------- */
    CosaMenu.on("start-game", function () {
      // e.g. window.location.href = "game.html";
      return CosaMenu.placeholder("Start Game", "Your game starts here.");
    });

  </script>
</body>
</html>
